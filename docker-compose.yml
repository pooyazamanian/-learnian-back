services:
  db:
    image: postgres:18-alpine
    container_name: lurnian-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lurnian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lurnian}
      POSTGRES_DB: ${POSTGRES_DB:-lurnian}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - lurnian_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  lurnian_pgdata:
